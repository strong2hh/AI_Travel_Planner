<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI旅行规划 - 重置密码</title>
    <link rel="stylesheet" href="/static/auth/style.css">
    <!-- 尝试多个Supabase CDN源 -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        // 如果主CDN失败，尝试备用源
        if (!window.supabase) {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
            document.head.appendChild(script);
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <div class="auth-header">
                <h1>AI旅行规划</h1>
                <p>设置新密码</p>
            </div>

            <div class="form-container">
                <h2>重置密码</h2>
                <form id="reset-password">
                    <div class="input-group">
                        <label for="new-password">新密码</label>
                        <input type="password" id="new-password" required placeholder="请输入新密码（至少6位）" minlength="6">
                    </div>
                    <div class="input-group">
                        <label for="confirm-password">确认新密码</label>
                        <input type="password" id="confirm-password" required placeholder="请再次输入新密码">
                    </div>
                    <button type="submit" class="btn-primary">重置密码</button>
                </form>
                <div id="reset-message" class="message"></div>
            </div>
        </div>
    </div>

    <script src="/static/auth/reset-password.js"></script>
</body>
</html>
