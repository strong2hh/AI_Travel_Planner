<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI旅行规划 - 地图界面</title>
    <link rel="stylesheet" href="/static/MAP/style.css">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
</head>
<body>
<div id="container">
    <div id="schedule-panel">
        <div class="schedule-header">
            <h3>行程安排</h3>
            <div class="day-selector">
                <label for="day-select">选择日期:</label>
                <select id="day-select"></select>
            </div>
        </div>
        <div class="schedule-content">
        </div>
    </div>

    <div id="input-panel">
        <div class="input-container">
            <input type="text" id="search-input" placeholder="输入目的地或语音搜索..." />

            <div class="button-container">
                <button id="ai-search-btn" class="ai-search-btn">
                    <span class="ai-search-icon">AI</span>
                </button>

                <div class="voice-container">
                    <button id="voice-btn" class="voice-btn">🎤</button>
                    <div id="voice-hint" class="voice-hint">长按开始说话</div>
                    <div id="recording-indicator" class="recording-indicator" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="map"></div>
    <div id="toast-container"></div>
</div>

<script src="/static/auth/auth-check.js"></script>

<script src="/static/MAP/MapApp.js"></script>

<script src="/static/MAP/VoiceRecognition.js"></script>
<script src="/static/MAP/RoutePlanner.js"></script>

<script src="/static/MAP/ScheduleManager.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        console.log('📄 页面DOM加载完成，开始初始化地图应用');

        // 强制设置搜索框位置
        const inputPanel = document.getElementById('input-panel');
        if (inputPanel) {
            const viewportWidth = window.innerWidth;
            const leftPanelHalf = 175;
            inputPanel.style.left = `calc(50% + ${leftPanelHalf}px)`;
            inputPanel.style.transform = 'translateX(-50%)';
            inputPanel.style.width = '800px';
            inputPanel.style.maxWidth = '800px';
        }

        try {
            const app = new MapApp();
            window.mapApp = app;

            app.init()
                .then(() => {
                    console.log('✅ 地图初始化流程完毕，开始初始化行程管理器');

                    // 确保 ScheduleManager 类已加载
                    if (typeof ScheduleManager === 'undefined') {
                        throw new Error('ScheduleManager 类未加载');
                    }

                    const scheduleManager = new ScheduleManager();
                    scheduleManager.initializeRoutePlanner();
                    window.scheduleManager = scheduleManager;

                    // 加载数据
                    scheduleManager.loadScheduleData();

                    console.log('行程安排与地图联动功能已启用');
                })
                .catch(error => {
                    console.error('💥 应用初始化异常:', error);
                    alert(`地图加载失败: ${error.message}`);
                });

        } catch (error) {
            console.error('💥 应用初始化异常 (同步错误):', error);
        }
    });
</script>
</body>
</html>
