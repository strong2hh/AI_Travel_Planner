<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统认证</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/auth/auth.css">
</head>
<body>

<div class="login-container">
    <div class="login-box">
        <div class="login-header">
            <h2 id="formTitle">欢迎回来</h2>
            <p id="formSubtitle">请登录您的账号以继续</p>
        </div>
        <form id="authForm">
            <div class="input-group">
                <label for="username">账号</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required autocomplete="off">
            </div>

            <div class="input-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>

            <div class="input-group" id="confirm-password-group" style="display: none;">
                <label for="confirmPassword">确认密码</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="请再次输入密码">
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">立即登录</button>

            <div class="toggle-box">
                <span id="toggleText">还没有账号？</span>
                <a href="#" id="toggleLink">去注册</a>
            </div>
        </form>
    </div>
</div>

<div id="toast-container" class="toast"></div>

<script src="/static/auth/auth.js"></script>
</body>
</html>
