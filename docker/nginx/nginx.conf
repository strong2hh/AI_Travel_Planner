server {
    listen 80;
    server_name localhost;
    absolute_redirect off;
    sendfile off;

    # 根目录保持不变，这样 /static/ 的请求会自然匹配到 /usr/share/nginx/html/static/
    root /usr/share/nginx/html;

    resolver 127.0.0.11 valid=30s;

    # 1. 根路径重定向
    # 访问域名根目录时，自动跳转到位于 /static/ 下的登录页
    location = / {
        return 301 /static/auth/index.html;
    }

    # 2. 兼容性重写 (可选)
    # 如果您的 JS 代码中有写死 window.location.href = '/MAP/index.html'
    # 这行配置会自动把它重定向到 /static/MAP/index.html，防止 404
    location /MAP/ {
        rewrite ^/MAP/(.*)$ /static/MAP/$1 permanent;
    }

    # 同理，兼容 /auth/ 路径
    location /auth/ {
        rewrite ^/auth/(.*)$ /static/auth/$1 permanent;
    }

    # 3. 后端接口代理 (保持您上传文件中的正确配置)
    location /api/ {
        set $backend_host backend;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_host:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. 静态资源兜底 (匹配代码中的 /static/ 请求)
    location /static/ {
        try_files $uri $uri/ =404;
        expires 1y;
        access_log off;
    }
}