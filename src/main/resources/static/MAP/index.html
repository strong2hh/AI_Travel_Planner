<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI旅行规划 - 地图界面</title>
    <link rel="stylesheet" href="/static/MAP/style.css">
</head>
<body>
    <div id="container">
        <!-- 输入控件面板 -->
        <div id="input-panel">
            <div class="input-container">
                <input type="text" id="search-input" placeholder="输入目的地或语音搜索..." />
                <div class="button-container">
                    <button id="ai-search-btn" class="ai-search-btn" title="AI助手搜索">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                        </svg>
                    </button>
                    <div class="voice-container">
                        <button id="voice-btn" class="voice-btn" title="长按录音">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 15c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v7c0 1.66 1.34 3 3 3z"/>
                                <path d="M17 12c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-2.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                            </svg>
                        </button>
                        <div id="recording-indicator" class="recording-indicator" style="display: none;">录音中: 0:00</div>
                        <div id="voice-hint" class="voice-hint">长按录音</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 地图容器 -->
        <div id="map"></div>
        
        <!-- 提示信息容器 -->
        <div id="toast-container"></div>
    </div>
    
    <!-- 地图API将由JavaScript动态加载 -->
    <script src="/static/MAP/map.js"></script>
</body>
</html>
